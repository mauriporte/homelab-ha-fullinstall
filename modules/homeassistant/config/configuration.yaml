# Starter configuration, copied to ${DATA_DIR}/homeassistant only if that folder is empty.
default_config:

frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  # Put each feature in its own file under packages/ (sensors, rest_commands, automations…)
  packages: !include_dir_named packages

http:
  # If Home Assistant sits behind a reverse proxy or Cloudflare Tunnel on another host, list it here.
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
